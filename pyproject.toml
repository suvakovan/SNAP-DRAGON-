[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lecturelens"
version = "0.1.0"
description = "Offline Lecture Copilot for Snapdragon PCs"
authors = [{ name = "LectureLens Team" }]
dependencies = [
    "numpy>=1.24.0",
    "soundfile>=0.12.1",
    "sounddevice>=0.4.6",
    "streamlit>=1.30.0",
    "openai>=1.10.0",
    "onnxruntime>=1.16.0",
    "pytest>=8.0.0",
    "psutil>=5.9.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.66.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "rich>=13.0.0",
    "scipy>=1.10.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
